name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python "${{ matrix.python-version }}"
      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" pytest

  quality:
    name: Quality and release checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.12
      - name: Run quality and release checks
        run: bash scripts/check.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full branch
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.97.0
        with:
          base: ""
          head: ${{ github.sha }}
          version: "3.97.0"
          extra_args: --results=verified,unknown
